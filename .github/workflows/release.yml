name: Sestavení a vydání

# Spustí se při každém pushnutí do větve main.
on:
  push:
    branches: [ main ]

# Potřebná oprávnění pro vytvoření GitHub Release.
permissions:
  contents: write

jobs:
  sestavit-a-vydat:
    runs-on: windows-latest

    steps:
      - name: Stažení kódu
        uses: actions/checkout@v4

      - name: Instalace .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Obnovení závislostí
        run: dotnet restore Bakalari/Bakalari.csproj

      - name: Publikování aplikace
        run: >
          dotnet publish Bakalari/Bakalari.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Vytvoření vydání na GitHubu
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Bakaláři v${{ github.run_number }}"
          body: |
            Automatické sestavení z commitu ${{ github.sha }}

            **Jak spustit:** Stáhněte `Bakalari.exe` a spusťte – nevyžaduje instalaci .NET.
          files: publish/Bakalari.exe
